spring.application.name=back

# Local PostgreSQL defaults. Override these variables outside development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/your_car_your_way}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate verifies that entities match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Browser client allowed to call the API. Override for another frontend origin.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Signed login session tokens. JWT_SECRET must be replaced in deployed environments.
app.security.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-before-deployment}
app.security.jwt.lifetime=${JWT_LIFETIME:PT1H}

# OpenAPI and Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
