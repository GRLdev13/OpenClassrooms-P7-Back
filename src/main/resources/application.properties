spring.application.name=back

# Local development database. Replace this DataSource for production.
spring.datasource.url=jdbc:h2:mem:back;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate manage the disposable development schema.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
