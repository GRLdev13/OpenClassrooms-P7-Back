services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: your_car_your_way
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d your_car_your_way"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
